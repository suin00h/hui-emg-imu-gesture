window:
  seconds: 1.5
  step_seconds: 0.2      # fixed by the published data; windows are pre-cut

split: leave_one_subject_out

episode:
  mode: enroll_one       # one session enrols, the remaining sessions are scored
  shots: 1
  draws: 12
  seed: 42

pool: enroll             # the unlabelled pool is the enrolling session, support windows included

metric: macro_f1         # averaged over episodes within a subject, then over subjects
rest_label: -1           # present in the data, excluded from the benchmark
